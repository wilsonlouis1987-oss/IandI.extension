name: Build and Publish I&I BIM Tools Installer

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  payload-check:
    runs-on: windows-latest
    outputs:
      has_payload: ${{ steps.check.outputs.has_payload }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Check for extension payload
        id: check
        shell: pwsh
        run: |
          if (Test-Path "IandI.extension.zip") {
            "has_payload=true" >> $env:GITHUB_OUTPUT
            Write-Host "Extension archive found."
          } elseif (Test-Path "IandI.extension") {
            $dyn = Get-ChildItem -Path "IandI.extension" -Recurse -Filter *.dyn -File
            if ($dyn) {
              "has_payload=true" >> $env:GITHUB_OUTPUT
              Write-Host "Extension folder found."
            } else {
              "has_payload=false" >> $env:GITHUB_OUTPUT
              Write-Warning "IandI.extension folder has no .dyn tools."
            }
          } else {
            "has_payload=false" >> $env:GITHUB_OUTPUT
            Write-Warning "Installer build skipped: add the actual IandI.extension.zip payload to the repository root."
          }

  build:
    needs: payload-check
    if: needs.payload-check.outputs.has_payload == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract extension payload
        shell: pwsh
        run: |
          if (Test-Path "IandI.extension.zip") {
            Expand-Archive -Path "IandI.extension.zip" -DestinationPath "." -Force
          }

      - name: Verify extension payload
        shell: pwsh
        run: |
          $dyn = Get-ChildItem -Path "IandI.extension" -Recurse -Filter *.dyn -File
          if (-not $dyn) {
            throw "IandI.extension payload is missing Dynamo .dyn files."
          }

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Compile Installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" setup.iss'

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: I_and_I_BIM_Tools_Installer
          path: Output\I_and_I_BIM_Tools_Installer.exe
          if-no-files-found: error

      - name: Publish installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Output/I_and_I_BIM_Tools_Installer.exe
          generate_release_notes: true
