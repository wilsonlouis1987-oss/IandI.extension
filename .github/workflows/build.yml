name: Publish Installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - I_and_I_BIM_Tools_Installer.exe
      - .github/workflows/build.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path Output | Out-Null
          Copy-Item I_and_I_BIM_Tools_Installer.exe Output/I_and_I_BIM_Tools_Installer.exe

      - name: Attach installer to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          files: Output/I_and_I_BIM_Tools_Installer.exe
