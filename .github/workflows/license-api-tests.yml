name: License API tests

on:
  push:
    branches: [ main ]
    paths:
      - 'license_server/**'
      - '.github/workflows/license-api-tests.yml'
  pull_request:
    paths:
      - 'license_server/**'
      - '.github/workflows/license-api-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r license_server/requirements.txt
      - name: Run license API tests
        working-directory: license_server
        run: python -m unittest discover -s tests -v
